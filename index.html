<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leave Intelligent Assistant (LIA)</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--ink:#242424;--mut:#616161;--line:#e0e0e0;--acc:#5b5fc7;--accfg:#fff;--bar:#464eb8;--me:#e8ebfa;--warn:#a86a0a;--bad:#c4314b;--ok:#107c10}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#1f1f1f;--card:#292929;--ink:#f5f5f5;--mut:#adadad;--line:#3d3d3d;--acc:#7f85f5;--accfg:#10102a;--bar:#2b2b40;--me:#3b3c66;--warn:#e0a548;--bad:#ff99a4;--ok:#6bb700}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI","Segoe UI Web",system-ui,-apple-system,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--bar);color:#fff}
h1{font-size:15px;font-weight:600;margin:0;display:flex;align-items:center;gap:10px}
h1:before{content:"L";display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;background:#fff;color:#464eb8;font-weight:700}
header label{font-size:13px}header select{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35)}header option{color:#242424}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-bottom:2px solid var(--line);border-radius:4px;padding:6px 8px;width:100%}
input:focus,textarea:focus,select:focus{border-bottom-color:var(--acc);outline:0}
button{background:var(--acc);color:var(--accfg);border:1px solid transparent;border-radius:4px;padding:6px 14px;cursor:pointer;font-weight:600}
button:hover{filter:brightness(.93)}button.g{background:var(--card);color:var(--ink);border-color:var(--line)}button.d{background:var(--bad);color:#fff}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav{display:flex;gap:2px;padding:0 16px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line)}
nav button{background:transparent;color:var(--mut);border-radius:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:400}
nav button:hover{background:var(--bg);filter:none}nav button.on{color:var(--acc);font-weight:600;border-color:var(--acc)}
main{max-width:980px;margin:0 auto;padding:16px 16px 60px}
.chat{display:flex;flex-direction:column;gap:10px;min-height:340px}
.m{max-width:640px;padding:10px 14px;border-radius:4px;background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.m.me{align-self:flex-end;background:var(--me);border-color:transparent;color:var(--ink)}
.m.bot:before{content:"LIA";display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
.cmd{display:flex;gap:8px;margin-top:14px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:4px}.cmd input{border:0}.hint{color:var(--mut);font-size:12px;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid label{font-size:12px;color:var(--mut)}.full{grid-column:1/-1}
.err{color:var(--bad);font-size:13px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600;background:var(--bg)}
.tw{overflow-x:auto}.tag{padding:1px 8px;border-radius:99px;border:1px solid currentColor;font-size:12px;white-space:nowrap}
.Pending{color:var(--warn)}.Approved{color:var(--ok)}.Rejected{color:var(--bad)}.Cancelled{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.row>*{width:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;min-width:640px}
.cal div{background:var(--card);border:1px solid var(--line);min-height:84px;padding:4px;font-size:12px}
.cal .h{min-height:0;color:var(--mut);font-weight:600}.cal b{display:block;color:var(--mut)}
.ev{border-left:3px solid var(--acc);padding-left:4px;margin-top:2px;background:var(--me)}.ev.ot{border-color:var(--warn);background:var(--bg)}
small{color:var(--mut)}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Leave Intelligent Assistant (LIA)</h1>
<label>Acting as <select id="who" style="width:auto"></select></label></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const USERS=[{id:'emp1',name:'Kwesi Amante',role:'Employee',mgr:'mgr1'},{id:'emp2',name:'Jan Derek Buquid',role:'Employee',mgr:'mgr2'},{id:'mgr1',name:'Marie-Cris Betis',role:'Manager',mgr:null},{id:'mgr2',name:'Hartell Torres',role:'Manager',mgr:null},{id:'hr1',name:'Margarita De la Torre',role:'HR',mgr:null}];
const ALLOW={Vacation:15,Sick:10,Emergency:5},LTYPES=Object.keys(ALLOW),KEY='leave_ot_agent_v2';
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=S||{filings:[],n:1,me:'emp1'};
let chat=[{who:'bot',html:'Hi! I can file leave and overtime. Type <b>/leave</b> or <b>/overtime</b>. Other commands: <b>/my</b> (my filings), <b>/balance</b>, <b>/help</b>.'}];
let tab='chat',cal=new Date(),flt={type:'',status:''};
const $=s=>document.querySelector(s),U=id=>USERS.find(u=>u.id===id),me=()=>U(S.me);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mins=t=>{const[a,b]=t.split(':');return +a*60+ +b},dur=(s,e)=>{s=mins(s);e=mins(e);return e>s?e-s:e+1440-s};
function otHours(f){const a=dur(f.aStart,f.aEnd);let ov=0;if(f.shiftDate===f.aDate){const s=mins(f.sStart),se=s+dur(f.sStart,f.sEnd),as=mins(f.aStart),ae=as+a;ov=Math.max(0,Math.min(se,ae)-Math.max(s,as))}return Math.round((a-ov)/60*100)/100}
const pad=n=>String(n).padStart(2,'0'),fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function expand(v){const a=v.date,b=v.date2||v.date;if(!a)return[];const out=[];let d=new Date(a+'T00:00:00'),e=new Date(b+'T00:00:00');if(e<d)return[];const multi=a!==b;for(;d<=e;d.setDate(d.getDate()+1)){const w=d.getDay();if(multi&&v.wk==='1'&&(w===0||w===6))continue;out.push(fmt(d))}return out}
const dts=f=>f.dates||[f.f.date];
const lines=r=>r.flatMap(f=>f.kind==='Leave'?dts(f).map(d=>({f,d})):[{f,d:f.f.aDate}]);
const lineDetail=l=>l.f.kind==='Leave'?`${esc(l.f.f.type)}, ${l.f.f.start}-${l.f.f.end} (${leaveDays(l.f.f)} day)`:detail(l.f);
function leaveDays(f){return Math.round(Math.min(dur(f.start,f.end),480)/480*100)/100}
const log=(x,m)=>x.log.push(new Date().toLocaleString()+' - '+m);
const visible=()=>{const u=me();return S.filings.filter(f=>u.role==='HR'||f.user===u.id||(u.role==='Manager'&&f.mgr===u.id))};
const used=(uid,t)=>S.filings.filter(f=>f.kind==='Leave'&&f.user===uid&&f.status==='Approved'&&f.f.type===t).reduce((a,f)=>a+f.days,0);
const detail=f=>f.kind==='Leave'?`${esc(f.f.type)} ${f.f.date}${f.f.date2&&f.f.date2!==f.f.date?' to '+f.f.date2:''}, ${f.f.start}-${f.f.end} each day (${dts(f).length} date${dts(f).length>1?'s':''}, ${f.days} day${f.days===1?'':'s'} total)`:`Shift ${f.f.shiftDate} ${f.f.sStart}-${f.f.sEnd}; actual ${f.f.aDate} ${f.f.aStart}-${f.f.aEnd}`+(f.status==='Approved'?` (${f.hours} OT hrs)`:'');
const tag=s=>`<span class="tag ${s}">${s}</span>`;
function fieldsLeave(v={}){return `<div class="grid"><div class="full"><label>Leave type<select name="type">${LTYPES.map(t=>`<option ${v.type===t?'selected':''}>${t}</option>`).join('')}</select></label></div>
<div><label>Actual date (from)<input type="date" name="date" value="${v.date||''}"></label></div><div><label>To date (optional, for a date range)<input type="date" name="date2" value="${v.date2||''}"></label></div><div class="full"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="wk" style="width:auto" ${v.wk!=='0'?'checked':''}> Skip Saturdays and Sundays in a date range</label></div>
<div><label>Actual start time<input type="time" name="start" value="${v.start||'09:00'}"></label></div><div><label>Actual end time<input type="time" name="end" value="${v.end||'18:00'}"></label></div>
<div class="full"><label>Reason (optional)<textarea name="reason" rows="2">${esc(v.reason)}</textarea></label></div></div>`}
function fieldsOT(v={}){return `<div class="grid"><div class="full"><label>Shift date<input type="date" name="shiftDate" value="${v.shiftDate||''}"></label></div>
<div><label>Shift start time<input type="time" name="sStart" value="${v.sStart||'09:00'}"></label></div><div><label>Shift end time<input type="time" name="sEnd" value="${v.sEnd||'18:00'}"></label></div>
<div class="full"><label>Actual date<input type="date" name="aDate" value="${v.aDate||''}"></label></div>
<div><label>Actual start time<input type="time" name="aStart" value="${v.aStart||'09:00'}"></label></div><div><label>Actual end time<input type="time" name="aEnd" value="${v.aEnd||'20:00'}"></label></div>
<div class="full"><label>Reason (required)<textarea name="reason" rows="2">${esc(v.reason)}</textarea></label></div></div>`}
function formMsg(m,i){const L=m.kind==='Leave';return `<div class="m" data-i="${i}"><b>${m.edit?'Correct and resubmit':'New'} ${L?'leave':'overtime'} filing</b>
${L?fieldsLeave(m.vals):fieldsOT(m.vals)}<div class="err"></div><div class="row" style="margin:10px 0 0"><button data-act="submit" data-i="${i}">${m.edit?'Resubmit':'Submit filing'}</button><button class="g" data-act="dismiss" data-i="${i}">Cancel</button></div></div>`}
function validate(kind,v){const e=[];
if(kind==='Leave'){if(!v.date)e.push('Actual date is required.');else if(v.date2&&v.date2<v.date)e.push('To date cannot be before the from date.');else if(!expand(v).length)e.push('No working dates in that range.');if(!v.start||!v.end)e.push('Start and end time are required.');else if(v.start===v.end)e.push('Start and end time must differ.')}
else{if(!v.shiftDate||!v.aDate)e.push('Shift date and actual date are required.');if(!v.sStart||!v.sEnd||!v.aStart||!v.aEnd)e.push('All start and end times are required.');if(!(v.reason||'').trim())e.push('Reason is mandatory for overtime.')}
return e}
function submit(i){const m=chat[i],el=document.querySelector(`.m[data-i="${i}"]`),v={};
el.querySelectorAll('[name]').forEach(x=>v[x.name]=x.type==='checkbox'?(x.checked?'1':'0'):x.value);const er=validate(m.kind,v);
if(!er.length&&m.kind==='Leave'){const d=Math.round(leaveDays(v)*expand(v).length*100)/100,left=ALLOW[v.type]-used(S.me,v.type);if(d>left+(m.edit?0:0))er.push(`Not enough ${v.type} leave left (${left} day).`)}
if(er.length){el.querySelector('.err').innerHTML=er.map(esc).join('<br>');return}
const u=me();
if(m.edit){const f=S.filings.find(x=>x.id===m.edit);f.f=v;f.status='Pending';f.comment='';f.dates=m.kind==='Leave'?expand(v):null;f.days=m.kind==='Leave'?Math.round(leaveDays(v)*f.dates.length*100)/100:0;log(f,'Corrected and resubmitted to '+U(f.mgr).name);chat.push({who:'bot',html:`Resubmitted <b>#${f.id}</b>. Routed to ${esc(U(f.mgr).name)}.`})}
else{const f={id:S.n++,kind:m.kind,user:u.id,mgr:u.mgr,status:'Pending',f:v,dates:m.kind==='Leave'?expand(v):null,days:m.kind==='Leave'?Math.round(leaveDays(v)*expand(v).length*100)/100:0,hours:0,comment:'',log:[]};log(f,'Submitted by '+u.name+', routed to '+(u.mgr?U(u.mgr).name:'n/a'));S.filings.push(f);
chat.push({who:'bot',html:`Filed <b>#${f.id}</b> (${m.kind}). Waiting for approval by ${esc(U(u.mgr).name)}. Switch to <i>Approvals</i> as the manager to decide.`})}
chat.splice(i,1);save();render()}
function decide(id,ok){const f=S.filings.find(x=>x.id==id),c=$('#c'+id).value.trim();
if(!ok&&!c){alert('Add a comment explaining the rejection.');return}
f.status=ok?'Approved':'Rejected';f.comment=c;
if(ok){if(f.kind==='OT')f.hours=otHours(f.f);log(f,'Approved by '+me().name+(f.kind==='Leave'?'. Posted to calendar, balance updated.':`. OT posted: ${f.hours} hrs.`))}
else log(f,'Rejected by '+me().name+': '+c);save();render()}
function cmd(t){t=t.trim();if(!t)return;chat.push({who:'me',html:esc(t)});const c=t.split(/\s+/)[0].toLowerCase();
if(c==='/leave'||c==='/overtime'){if(me().role==='HR'){chat.push({who:'bot',html:'HR accounts view and extract data. Switch to an employee to file.'})}else if(!me().mgr){chat.push({who:'bot',html:'Managers file under their own manager; none is set up in this demo. Switch to an employee.'})}else chat.push({who:'bot',form:1,kind:c==='/leave'?'Leave':'OT',vals:{}})}
else if(c==='/my'){const l=S.filings.filter(f=>f.user===S.me);chat.push({who:'bot',html:l.length?l.map(f=>`#${f.id} ${f.kind}: ${detail(f)} ${tag(f.status)}`).join('<br>'):'No filings yet.'})}
else if(c==='/balance'){const u=me();chat.push({who:'bot',html:LTYPES.map(t=>`${t}: ${(ALLOW[t]-used(u.id,t)).toFixed(2)} of ${ALLOW[t]} days left`).join('<br>')+`<br>Approved OT: ${S.filings.filter(f=>f.user===u.id&&f.kind==='OT'&&f.status==='Approved').reduce((a,f)=>a+f.hours,0).toFixed(2)} hrs`})}
else chat.push({who:'bot',html:'Commands: <b>/leave</b>, <b>/overtime</b>, <b>/my</b>, <b>/balance</b>. Use the tabs to approve, view the calendar or export data.'});
render()}
function vChat(){return `<div class="chat">${chat.map((m,i)=>m.form?formMsg(m,i):`<div class="m ${m.who}">${m.html}</div>`).join('')}</div>
<div class="cmd"><input id="ci" placeholder="Type /leave or /overtime" autocomplete="off"><button data-act="send">Send</button></div><div class="hint">Try /leave, /overtime, /my, /balance, /help</div>`}
function vMine(){const l=S.filings.filter(f=>f.user===S.me);if(!l.length)return '<p>Nothing filed yet. Use /leave or /overtime in the chat.</p>';
return l.slice().reverse().map(f=>`<div class="card"><div class="row"><b>#${f.id} ${f.kind==='OT'?'Overtime':'Leave'}</b>${tag(f.status)}<small>Approver: ${esc(U(f.mgr).name)}</small></div>${detail(f)}<br><small>Reason: ${esc(f.f.reason||'-')}</small>${f.comment?`<br><small>Manager comment: ${esc(f.comment)}</small>`:''}
${f.status==='Rejected'?`<div class="row" style="margin-top:10px"><button data-act="edit" data-id="${f.id}">Correct and resubmit</button><button class="g" data-act="cancel" data-id="${f.id}">Cancel filing</button></div>`:''}
<details><summary><small>History</small></summary><small>${f.log.map(esc).join('<br>')}</small></details></div>`).join('')}
function vApprove(){if(me().role!=='Manager')return '<p>Only managers approve filings. Switch to an approver (Marie-Cris Betis or Hartell Torres) to try it.</p>';
const l=S.filings.filter(f=>f.mgr===S.me&&f.status==='Pending');if(!l.length)return '<p>No filings waiting for you.</p>';
return l.map(f=>`<div class="card"><div class="row"><b>#${f.id} ${f.kind==='OT'?'Overtime':'Leave'}</b><small>from ${esc(U(f.user).name)}</small></div>${detail(f)}<br><small>Reason: ${esc(f.f.reason||'-')}</small>
<div class="row" style="margin-top:10px"><input id="c${f.id}" placeholder="Comment (required if rejecting)" style="flex:1;min-width:200px"><button data-act="ok" data-id="${f.id}">Approve</button><button class="d" data-act="no" data-id="${f.id}">Reject</button></div></div>`).join('')}
function vCal(){const y=cal.getFullYear(),m=cal.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
const ev=visible().filter(f=>f.status==='Approved');let h=`<div class="row"><button class="g" data-act="prev">Prev</button><b>${cal.toLocaleString('en',{month:'long',year:'numeric'})}</b><button class="g" data-act="next">Next</button></div><div class="tw"><div class="cal">`+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="h">${d}</div>`).join('')+'<div style="border:0;background:none"></div>'.repeat(first);
for(let d=1;d<=n;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
h+=`<div><b>${d}</b>`+ev.filter(f=>(f.kind==='Leave'?dts(f).includes(ds):f.f.aDate===ds)).map(f=>`<div class="ev ${f.kind==='OT'?'ot':''}">${esc(U(f.user).name.split(' ')[0])}: ${f.kind==='Leave'?esc(f.f.type):f.hours+'h OT'}</div>`).join('')+'</div>'}
return h+'</div></div>'}
function rows(){return visible().filter(f=>(!flt.type||f.kind===flt.type)&&(!flt.status||f.status===flt.status))}
function vRep(){const r=rows(),emp=USERS.filter(u=>u.role==='Employee'&&visible().some(f=>f.user===u.id)||u.id===S.me&&u.role==='Employee');
return `<div class="row"><select id="ft" style="width:auto"><option value="">All types</option><option value="Leave" ${flt.type==='Leave'?'selected':''}>Leave</option><option value="OT" ${flt.type==='OT'?'selected':''}>Overtime</option></select>
<select id="fs" style="width:auto"><option value="">All statuses</option>${['Pending','Approved','Rejected','Cancelled'].map(s=>`<option ${flt.status===s?'selected':''}>${s}</option>`).join('')}</select><button data-act="csv">Export CSV</button></div>
<div class="tw"><table><tr><th>#</th><th>Employee</th><th>Type</th><th>Date</th><th>Details</th><th>Status</th><th>Approver</th></tr>${lines(r).map(l=>{const f=l.f;return `<tr><td>${f.id}</td><td>${esc(U(f.user).name)}</td><td>${f.kind}</td><td>${l.d}</td><td>${lineDetail(l)}</td><td>${tag(f.status)}</td><td>${esc(U(f.mgr).name)}</td></tr>`}).join('')||'<tr><td colspan="7">No filings.</td></tr>'}</table></div>
<h3>Balances and OT totals</h3><div class="tw"><table><tr><th>Employee</th>${LTYPES.map(t=>`<th>${t} left</th>`).join('')}<th>Approved OT hrs</th></tr>${emp.map(u=>`<tr><td>${esc(u.name)}</td>${LTYPES.map(t=>`<td>${(ALLOW[t]-used(u.id,t)).toFixed(2)}</td>`).join('')}<td>${S.filings.filter(f=>f.user===u.id&&f.kind==='OT'&&f.status==='Approved').reduce((a,f)=>a+f.hours,0).toFixed(2)}</td></tr>`).join('')}</table></div>`}
function csv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',H=['ID','Employee','Type','Status','Approver','LeaveType','Date','Start','End','ShiftDate','ShiftStart','ShiftEnd','ActualDate','ActualStart','ActualEnd','LeaveDays','OTHours','Reason','ManagerComment'];
const L=lines(rows()).map(l=>{const f=l.f;return [f.id,U(f.user).name,f.kind,f.status,U(f.mgr).name,f.f.type,f.kind==='Leave'?l.d:'',f.f.start,f.f.end,f.f.shiftDate,f.f.sStart,f.f.sEnd,f.f.aDate,f.f.aStart,f.f.aEnd,f.kind==='Leave'?leaveDays(f.f):'',f.hours,f.f.reason,f.comment].map(q).join(',')});
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([[H.join(',')].concat(L).join('\n')],{type:'text/csv'}));a.download='leave-ot-filings.csv';a.click()}
function render(){const u=me(),pend=S.filings.filter(f=>f.mgr===S.me&&f.status==='Pending').length;
$('#who').innerHTML=USERS.map(x=>`<option value="${x.id}" ${x.id===S.me?'selected':''}>${x.name} (${x.role})</option>`).join('');
const T=[['chat','Agent chat'],['mine','My filings'],['appr','Approvals'+(pend?` (${pend})`:'')],['cal','Calendar'],['rep','Reports']];
$('#nav').innerHTML=T.map(t=>`<button data-tab="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('');
$('#main').innerHTML={chat:vChat,mine:vMine,appr:vApprove,cal:vCal,rep:vRep}[tab]();const ci=$('#ci');if(ci)ci.focus({preventScroll:true})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
if(b.dataset.tab){tab=b.dataset.tab;return render()}
if(a==='send'){const i=$('#ci');return cmd(i.value)}
if(a==='submit')submit(+b.dataset.i);else if(a==='dismiss'){chat.splice(+b.dataset.i,1);render()}
else if(a==='ok')decide(id,true);else if(a==='no')decide(id,false);
else if(a==='cancel'){const f=S.filings.find(x=>x.id==id);f.status='Cancelled';log(f,'Cancelled by employee');save();render()}
else if(a==='edit'){const f=S.filings.find(x=>x.id==id);chat.push({who:'bot',form:1,kind:f.kind,vals:f.f,edit:f.id});tab='chat';render()}
